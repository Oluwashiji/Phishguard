services:
  # ── Backend (Flask inference API) ───────────────────────────────────────────
  # NOTE: Models must be committed to the repo under backend/models/ before
  # deploying. Run `python training/train.py` locally first.
  - type: web
    name: phishguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_ENV
        value: production

  # ── Frontend (React / Vite static site) ────────────────────────────────────
  - type: web
    name: phishguard-app
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://phishguard-api.onrender.com/api   # update after backend deploys
    routes:
      - type: rewrite
        source: /*
        destination: /index.html